<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Chameleon Viewer</title>
        <style>
            body {
                margin: 0;
                font-family: sans-serif;
                font-size: 13px;
                color: rgb(34, 34, 34);
            }

            .container {
                margin: 16px;
                display: flex;
                flex-direction: column;
                gap: 12px;
            }

            .hint {
                margin: 0;
                color: rgb(110, 110, 110);
            }

            dl {
                display: grid;
                grid-template-columns: auto 1fr;
                gap: 4px 12px;
                margin: 0;
            }

            dt {
                color: rgb(110, 110, 110);
            }

            dd {
                margin: 0;
                font-weight: bold;
            }

            img {
                max-width: 100%;
                border: 1px solid rgb(220, 220, 220);
            }

            .error {
                margin: 0;
                color: rgb(200, 40, 40);
            }

            button {
                background-color: rgb(82, 88, 228);
                border-color: rgb(82, 88, 228);
                border-radius: 16px;
                border-style: solid;
                color: rgb(255, 255, 255);
                font-family: sans-serif;
                height: 32px;
            }

            button:disabled {
                background-color: rgb(177, 177, 177);
                border-color: rgb(177, 177, 177);
            }

            button:not([disabled]):hover {
                background-color: rgb(64, 70, 202);
                cursor: pointer;
            }
        </style>
    </head>
    <body>
        <div class="container">
            <p class="hint">Pick an engine output JSON and its rendered PNG from output/.</p>
            <input id="files" type="file" accept=".json,.png,application/json,image/png" multiple />
            <dl>
                <dt>Design</dt>
                <dd id="design-name">none</dd>
                <dt>Canvas</dt>
                <dd id="canvas-size">-</dd>
                <dt>Elements</dt>
                <dd id="element-count">-</dd>
                <dt>PNG</dt>
                <dd id="png-size">-</dd>
            </dl>
            <p id="error" class="error" hidden></p>
            <img id="preview" alt="Rendered output" hidden />
            <button id="add-image" disabled>Add image to document</button>
        </div>
        <script type="module" src="add-on-console-override.js"></script>
        <script type="module" src="index.js"></script>
    </body>
</html>
